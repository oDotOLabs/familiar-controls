name: Nightly Release

on:
  schedule:
    - cron: '0 18 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Set nightly version
        id: nightly
        run: |
          VERSION="nightly-$(date -u +%Y%m%d)-${GITHUB_SHA::7}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build
        run: ./gradlew build

      - name: Publish GitHub release
        uses: Kira-NT/mc-publish@v3.3.2
        with:
          github-token: ${{ secrets.LUICL_TOKEN }}
          github-tag: ${{ steps.nightly.outputs.version }}
          github-prerelease: true
          github-generate-changelog: false
          name: Familiar Controls ${{ steps.nightly.outputs.version }}
          version: ${{ steps.nightly.outputs.version }}
          version-type: alpha
          changelog: Automated nightly build of ${{ github.sha }}.
          files: build/libs/!(*-@(dev|sources|javadoc)).jar
          loaders: fabric
          environment: client
          game-versions: 26.2
          java: '25'
